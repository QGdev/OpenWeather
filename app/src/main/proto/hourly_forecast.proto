syntax = "proto3";

option java_package = "fr.qgdev.openweather.data.models";
option java_multiple_files = true;

message HourlyForecast {
  int64 dt = 1;
  string weather = 2;
  string weatherDescription = 3;
  int32 weatherCode = 4;
  float temperature = 5;
  float temperatureFeelsLike = 6;
  int32 pressure = 7;
  int32 humidity = 8;
  float dewPoint = 9;
  int32 cloudiness = 10;
  int32 visibility = 11;
  int32 uvIndex = 12;
  float windSpeed = 13;
  float windGustSpeed = 14;
  int32 windDirection = 15;
  float pop = 16;
  float rain = 17;
  float snow = 18;
}
